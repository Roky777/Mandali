{% load billing %}<section class="collections-chart"><div class="section-heading"><div><h2>Collections over time</h2><p class="field-help">Workspace receipts across the last six months.</p></div><span class="tag">Last 6 months</span></div><div class="revenue-chart" role="img" aria-label="Payments received in the last six months. Each month has a labeled amount.">{% for row in trend %}<div class="chart-column"><span class="chart-value" title="{{ row.amount|inr }}">{{ row.amount|compact_inr }}</span><div class="bar-track"><div class="chart-bar level-{{ row.level }}"></div></div><span>{{ row.label }}</span></div>{% endfor %}</div><p class="field-help">All workspace customers and plans. Sandbox invoices and reversed payments are excluded.</p></section>
