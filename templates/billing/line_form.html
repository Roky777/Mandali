<form class="line-form" method="post" action="{{ action }}">{% csrf_token %}<div>
<label for="id_item">{{ form.item.label }}</label>{{ form.item }}
</div>
<div class="quantity">
<label for="id_quantity">{{ form.quantity.label }}</label>{{ form.quantity }}
</div>

</form>
